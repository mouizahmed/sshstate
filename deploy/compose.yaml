# Self-hosted sshstate relay: one non-root container, one persistent volume, no
# telemetry. It speaks plain HTTP and needs an HTTPS reverse proxy in front of
# it. Bring your own, or run the bundled one with `--profile tls`.

# Pinned so the volume is always sshstate_relay-data. Without it Compose names
# the project after whichever directory this file was downloaded into, and the
# backup and move instructions would not match what is on the host.
name: sshstate

services:
  relay:
    # Pin a release tag or set SSHSTATE_IMAGE to a verified digest. Never deploy
    # `latest`: 0.x releases may require a coordinated client/relay upgrade.
    # `docker compose up --build` still builds from the source tree below.
    image: ${SSHSTATE_IMAGE:-ghcr.io/mouizahmed/sshstate-server:v0.1.4}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Published on loopback only. Terminate TLS in a reverse proxy and forward
    # to this port; clients must reach the relay over HTTPS, and the container
    # is left with -public-http unset so signatures are verified against the
    # https authority. The bundled Caddy below reaches it over the Compose
    # network instead and does not need this.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - relay-data:/var/lib/sshstate

  # Off unless you ask for it: `DOMAIN=relay.example.com docker compose
  # --profile tls up -d`. Without the profile nothing binds 80 or 443, so a host
  # that already runs an ingress is left alone.
  caddy:
    profiles:
      - tls
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy obtains and renews the certificate itself, and its reverse_proxy
    # passes the client's Host through unchanged, which the request signatures
    # require.
    # DOMAIN is the public name clients will use. It is required with this
    # profile; it is not marked required here because Compose interpolates the
    # whole file even when the profile is off, which would break the default
    # deployment for everyone who never asks for TLS.
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay

# Inline so this file deploys on its own, with no checkout beside it. A bind
# mount would have Docker create a directory named Caddyfile when the file is
# absent, and Caddy would start on a default config instead of failing.
configs:
  caddyfile:
    content: |
      {$$DOMAIN} {
      	reverse_proxy relay:8080
      	request_body {
      		max_size 256MB
      	}
      }

volumes:
  relay-data:
  caddy-data:
  caddy-config:
