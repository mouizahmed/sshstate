name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Test both supported platforms. Go 1.27 provides crypto/mldsa.
        os: [macos-latest, ubuntu-latest]
        # 1.27.0 verifies the floor declared in go.mod is honest; 1.27.1 is the
        # latest patch. Go 1.26 cannot build this project at all.
        go: ['1.27.0', '1.27.1']
    runs-on: ${{ matrix.os }}
    env:
      # go.mod carries `toolchain go1.27.1`. Under the default GOTOOLCHAIN=auto
      # that directive makes Go download and switch to 1.27.1 whatever version
      # is installed, which would silently turn the 1.27.0 floor job into a
      # second 1.27.1 job. `local` pins each run to the toolchain setup-go
      # installed, so the floor is actually exercised.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

      # The race detector finds races in this code, not in the operating
      # system, so the full suite runs under it once rather than on every
      # matrix cell. Linux is about three times faster than the hosted macOS
      # runners for identical work, so that is where it runs.
      #
      # The timeout is raised because the suite is integration-heavy: almost
      # every test starts a real daemon, binds two Unix sockets, opens SQLite,
      # and several spawn ssh, sshd or ssh -G. Measured on an M-series Mac,
      # internal/daemon takes 212s under -race across 40 tests; argon2id is
      # about 13% of that and starting real daemons is most of the rest. Go's
      # default is 10 minutes per package, and a hosted runner crosses it.
      - name: test -race
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.1'
        run: go test -race -timeout 30m ./...

      # Linux cannot reach these: launchd activation through cgo, the macOS
      # LOCAL_PEERCRED socket check, and the launchd service definition. They
      # are small, so covering them under -race here costs seconds.
      - name: test -race (darwin-only packages)
        if: matrix.os == 'macos-latest'
        run: go test -race -timeout 30m ./internal/activation/ ./internal/peercred/ ./internal/service/

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      # Linux ships static, so CGO_ENABLED=0 is what release builds use and
      # what this checks. darwin is deliberately absent: it needs cgo for the
      # launchd adapter and cannot be cross-compiled from here, so it is built
      # on macOS runners by release.yml and checked there for the symbol.
      - name: cross-build
        run: |
          set -eux
          for t in linux/amd64 linux/arm64; do
            GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0 go build -o /dev/null ./...
          done

  fuzz:
    # `go test` already runs every seed corpus, which is the regression half.
    # This job is the other half: a short exploratory run per target, so the
    # parsers that take input from a relay, a peer, or an old known_hosts file
    # keep being pushed at rather than only replayed against known cases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: fuzz
        run: |
          set -eux
          fuzz() { go test "$1" -run '^$' -fuzz "^$2\$" -fuzztime 60s; }
          fuzz ./internal/protocol FuzzStrictUnmarshalEnvelope
          fuzz ./internal/protocol FuzzStrictUnmarshalMembership
          fuzz ./internal/protocol FuzzCounterAndBytes
          fuzz ./internal/protocol FuzzParseFingerprint
          fuzz ./internal/sshconfig FuzzParseImport
          fuzz ./internal/knownhosts FuzzParseLine
          fuzz ./internal/knownhosts FuzzParseFile
          fuzz ./internal/httpsig FuzzParseSignatureParams
          fuzz ./internal/httpsig FuzzParseByteSequence
          fuzz ./internal/httpsig FuzzParseDictionaryMember

  native-ssh:
    # A real sshd, real OpenSSH, and a private key that exists only in the
    # vault. Separate from the `check` matrix because it needs an sshd binary,
    # and a silent skip there would look like coverage it is not. Systemd
    # activation stays uncovered here: the runners have no user manager.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: sshd is present
        run: test -x /usr/sbin/sshd
      - name: native ssh login
        run: SSHSTATE_SSHD_TEST=1 go test ./internal/cli/ -run NativeSSH -v

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
