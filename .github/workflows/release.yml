name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin needs cgo: launch_activate_socket is a C library call with
          # no syscall equivalent, and a CGO_ENABLED=0 build links none of it
          # and then cannot adopt launchd sockets at all.
          - {os: macos-latest, goos: darwin, goarch: arm64, cgo: '1'}
          - {os: macos-latest, goos: darwin, goarch: amd64, cgo: '1'}
          # linux has no such dependency, so these are static.
          - {os: ubuntu-latest, goos: linux, goarch: amd64, cgo: '0'}
          - {os: ubuntu-latest, goos: linux, goarch: arm64, cgo: '0'}
    runs-on: ${{ matrix.os }}
    env:
      # The released binary is built by the toolchain the tests ran under, not
      # by whatever the toolchain directive would fetch.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -eux
          version="${GITHUB_REF_NAME}"
          if [ "${{ matrix.goos }}${{ matrix.goarch }}" = "darwinamd64" ]; then
            export CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64"
          fi
          mkdir -p dist/stage
          go build -trimpath \
            -ldflags "-X github.com/mouizahmed/sshstate/internal/buildinfo.Version=${version}" \
            -o dist/stage/sshstate ./cmd/sshstate
          cp LICENSE README.md dist/stage/

      - name: verify the darwin build carries the launchd adapter
        if: matrix.goos == 'darwin'
        run: |
          set -eu
          n="$(nm dist/stage/sshstate | grep -c launch_activate_socket || true)"
          if [ "$n" -eq 0 ]; then
            echo "this darwin binary has no launchd adapter; cgo did not link" >&2
            exit 1
          fi

      - name: package
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          name="sshstate_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          tar -C dist/stage -czf "dist/${name}.tar.gz" sshstate LICENSE README.md

      - name: install nFPM
        if: matrix.goos == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: package for Linux distributions
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eux
          export VERSION="${GITHUB_REF_NAME#v}"
          name="sshstate_${VERSION}_linux_${GOARCH}"
          for format in deb rpm apk; do
            "$(go env GOPATH)/bin/nfpm" package \
              --config packaging/nfpm.yaml --packager "${format}" \
              --target "dist/${name}.${format}"
          done
          "$(go env GOPATH)/bin/nfpm" package \
            --config packaging/nfpm.yaml --packager archlinux \
            --target "dist/${name}.pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
          if-no-files-found: error

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sshstate-server:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}/sshstate-server:latest', github.repository_owner) || '' }}

      # Signed by digest, not by tag: a tag can be moved to different content
      # later, a digest cannot.
      - name: sign the image
        uses: sigstore/cosign-installer@v3
      - run: |
          set -eux
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/sshstate-server@${{ steps.push.outputs.digest }}"

  release:
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-{amd64,arm64}"
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -eux
          cp deploy/compose.yaml dist/compose.yaml
          cd dist
          sha256sum -- *.tar.gz *.deb *.rpm *.apk *.pkg.tar.zst compose.yaml > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      # Checksums prove a download is intact, not that it came from here:
      # whoever can replace a tarball can replace the sums beside it. The
      # signature is over SHA256SUMS, made with this workflow's OIDC identity,
      # so there is no private key to hold or rotate.
      - name: sign the checksums
        run: |
          set -eux
          cd dist
          cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.cosign.bundle

      - name: release notes
        run: |
          cat > notes.md <<'EOF'
          - Issue relay bootstrap secrets on demand with `sshstate-server new-bootstrap-secret`.
          - Deploy the relay from one Compose file, with optional Caddy TLS and a fixed volume name.
          - Build Linux packages and signed repositories for apt, dnf, apk, and pacman.
          - Reject relay URLs containing credentials, paths, queries, or fragments.
          - License the project under MIT.
          - Verify downloads with `SHA256SUMS` and `SHA256SUMS.cosign.bundle`; see the [install guide](https://github.com/mouizahmed/sshstate#quick-start).
          EOF

      # Uploads to uploads.github.com answer 500 often enough to lose a release
      # that attaches its files in one call. The release is staged as a draft,
      # each file is uploaded on its own with retries, and the draft is only
      # published once every file is attached, so a rerun resumes instead of
      # starting over.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == *-* ]]; then
            prerelease=(--prerelease)
          else
            prerelease=()
          fi
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --draft --title "${tag}" --notes-file notes.md "${prerelease[@]}"
          fi
          for file in dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.apk dist/*.pkg.tar.zst dist/compose.yaml dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle; do
            attempt=1
            until gh release upload "${tag}" "${file}" --clobber; do
              if [ "${attempt}" -ge 5 ]; then
                echo "uploading ${file} failed five times" >&2
                exit 1
              fi
              sleep $(( attempt * 15 ))
              attempt=$(( attempt + 1 ))
            done
          done
          gh release edit "${tag}" --draft=false "${prerelease[@]}"

  package-repositories:
    if: vars.PACKAGE_REPOS_ENABLED == 'true' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-{amd64,arm64}"
          path: dist
          merge-multiple: true
      - name: install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg rpm createrepo-c openssl
          docker --version
      - name: download retained releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,isDraft,publishedAt \
            --jq '[.[] | select(.isPrerelease == false and .isDraft == false and (.tagName | contains("-") | not))] | sort_by(.publishedAt) | reverse | .[:5] | .[].tagName')
          while IFS= read -r tag; do
            test -n "$tag" || continue
            test "$tag" != "$GITHUB_REF_NAME" || continue
            count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name | select(test("\\.(deb|rpm|apk|pkg\\.tar\\.zst)$"))] | length')
            if [ "$count" -gt 0 ]; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist --skip-existing \
                --pattern '*.deb' --pattern '*.rpm' --pattern '*.apk' --pattern '*.pkg.tar.zst'
            fi
          done <<< "$tags"
      - name: import package signing keys
        env:
          PACKAGE_GPG_PRIVATE_KEY_B64: ${{ secrets.PACKAGE_GPG_PRIVATE_KEY_B64 }}
          PACKAGE_APK_PRIVATE_KEY_B64: ${{ secrets.PACKAGE_APK_PRIVATE_KEY_B64 }}
        run: |
          set -eu
          test -n "$PACKAGE_GPG_PRIVATE_KEY_B64"
          test -n "$PACKAGE_APK_PRIVATE_KEY_B64"
          umask 077
          mkdir -p "$RUNNER_TEMP/package-keys/gnupg"
          printf '%s' "$PACKAGE_GPG_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/package-keys/private.gpg"
          printf '%s' "$PACKAGE_APK_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/package-keys/sshstate.rsa"
          export GNUPGHOME="$RUNNER_TEMP/package-keys/gnupg"
          gpg --batch --import "$RUNNER_TEMP/package-keys/private.gpg"
      - name: build signed package repositories
        env:
          GNUPGHOME: ${{ runner.temp }}/package-keys/gnupg
          PACKAGE_APK_KEY_FILE: ${{ runner.temp }}/package-keys/sshstate.rsa
        run: bash packaging/build-repositories.sh "${GITHUB_REF_NAME#v}" dist dist/package-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/package-site
      - id: deploy
        uses: actions/deploy-pages@v4
